<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>프레임 파이프라이닝 전후 타임라인</title>
  <desc>개선 전에는 CPU가 커맨드를 기록한 뒤 GPU가 끝날 때까지 대기하고, GPU는 CPU가 기록하는 동안 유휴 상태여서 둘이 번갈아 논다. Frame Resources를 도입하면 프레임마다 커맨드 할당자와 상수 버퍼를 따로 두어, CPU가 다음 프레임을 기록하는 동안 GPU가 이전 프레임을 그려 두 작업이 겹친다.</desc>
  <style>
    .h  { font: 500 15px "Malgun Gothic", "Segoe UI", sans-serif; fill: #18181b; }
    .l  { font: 400 12px "Malgun Gothic", "Segoe UI", sans-serif; fill: #52525b; }
    .b  { font: 400 12px "Malgun Gothic", "Segoe UI", sans-serif; fill: #1e3a8a; }
    .g  { font: 400 12px "Malgun Gothic", "Segoe UI", sans-serif; fill: #4c1d95; }
    .i  { font: 400 12px "Malgun Gothic", "Segoe UI", sans-serif; fill: #71717a; }
    .cpu  { fill: #bfdbfe; }
    .gpu  { fill: #ddd6fe; }
    .idle { fill: #e4e4e7; }
  </style>

  <rect width="700" height="380" fill="#ffffff"/>

  <!-- ============ 개선 전 ============ -->
  <text class="h" x="30" y="34">개선 전 — 매 프레임 완전 플러시 (WaitForGpu)</text>

  <text class="l" x="30" y="74">CPU</text>
  <rect class="cpu"  x="95" y="58" width="66" height="24" rx="4"/>
  <text class="b" x="128" y="74" text-anchor="middle">F0 기록</text>
  <rect class="idle" x="161" y="58" width="56" height="24" rx="4"/>
  <text class="i" x="189" y="74" text-anchor="middle">대기</text>
  <rect class="cpu"  x="217" y="58" width="66" height="24" rx="4"/>
  <text class="b" x="250" y="74" text-anchor="middle">F1 기록</text>
  <rect class="idle" x="283" y="58" width="56" height="24" rx="4"/>
  <text class="i" x="311" y="74" text-anchor="middle">대기</text>
  <rect class="cpu"  x="339" y="58" width="66" height="24" rx="4"/>
  <text class="b" x="372" y="74" text-anchor="middle">F2 기록</text>
  <rect class="idle" x="405" y="58" width="56" height="24" rx="4"/>
  <text class="i" x="433" y="74" text-anchor="middle">대기</text>

  <text class="l" x="30" y="108">GPU</text>
  <rect class="idle" x="95" y="92" width="66" height="24" rx="4"/>
  <text class="i" x="128" y="108" text-anchor="middle">유휴</text>
  <rect class="gpu"  x="161" y="92" width="56" height="24" rx="4"/>
  <text class="g" x="189" y="108" text-anchor="middle">F0</text>
  <rect class="idle" x="217" y="92" width="66" height="24" rx="4"/>
  <text class="i" x="250" y="108" text-anchor="middle">유휴</text>
  <rect class="gpu"  x="283" y="92" width="56" height="24" rx="4"/>
  <text class="g" x="311" y="108" text-anchor="middle">F1</text>
  <rect class="idle" x="339" y="92" width="66" height="24" rx="4"/>
  <text class="i" x="372" y="108" text-anchor="middle">유휴</text>
  <rect class="gpu"  x="405" y="92" width="56" height="24" rx="4"/>
  <text class="g" x="433" y="108" text-anchor="middle">F2</text>

  <line x1="461" y1="50" x2="461" y2="126" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="l" x="471" y="92">3 프레임</text>
  <text class="l" x="95" y="144">한쪽이 일하는 동안 다른 쪽은 항상 쉰다</text>

  <!-- ============ 개선 후 ============ -->
  <text class="h" x="30" y="202">개선 후 — Frame Resources 2세트 (kFramesInFlight = 2)</text>

  <text class="l" x="30" y="242">CPU</text>
  <rect class="cpu" x="95"  y="226" width="58" height="24" rx="4"/>
  <text class="b" x="124" y="242" text-anchor="middle">F0</text>
  <rect class="cpu" x="156" y="226" width="58" height="24" rx="4"/>
  <text class="b" x="185" y="242" text-anchor="middle">F1</text>
  <rect class="cpu" x="217" y="226" width="58" height="24" rx="4"/>
  <text class="b" x="246" y="242" text-anchor="middle">F2</text>
  <rect class="cpu" x="278" y="226" width="58" height="24" rx="4"/>
  <text class="b" x="307" y="242" text-anchor="middle">F3</text>
  <rect class="cpu" x="339" y="226" width="58" height="24" rx="4"/>
  <text class="b" x="368" y="242" text-anchor="middle">F4</text>
  <rect class="cpu" x="400" y="226" width="58" height="24" rx="4"/>
  <text class="b" x="429" y="242" text-anchor="middle">F5</text>

  <text class="l" x="30" y="276">GPU</text>
  <rect class="idle" x="95"  y="260" width="58" height="24" rx="4"/>
  <text class="i" x="124" y="276" text-anchor="middle">유휴</text>
  <rect class="gpu" x="156" y="260" width="58" height="24" rx="4"/>
  <text class="g" x="185" y="276" text-anchor="middle">F0</text>
  <rect class="gpu" x="217" y="260" width="58" height="24" rx="4"/>
  <text class="g" x="246" y="276" text-anchor="middle">F1</text>
  <rect class="gpu" x="278" y="260" width="58" height="24" rx="4"/>
  <text class="g" x="307" y="276" text-anchor="middle">F2</text>
  <rect class="gpu" x="339" y="260" width="58" height="24" rx="4"/>
  <text class="g" x="368" y="276" text-anchor="middle">F3</text>
  <rect class="gpu" x="400" y="260" width="58" height="24" rx="4"/>
  <text class="g" x="429" y="276" text-anchor="middle">F4</text>

  <line x1="461" y1="218" x2="461" y2="294" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="l" x="471" y="260">6 프레임</text>

  <text class="l" x="30"  y="312">세트</text>
  <text class="l" x="124" y="312" text-anchor="middle">A</text>
  <text class="l" x="185" y="312" text-anchor="middle">B</text>
  <text class="l" x="246" y="312" text-anchor="middle">A</text>
  <text class="l" x="307" y="312" text-anchor="middle">B</text>
  <text class="l" x="368" y="312" text-anchor="middle">A</text>
  <text class="l" x="429" y="312" text-anchor="middle">B</text>

  <text class="l" x="95" y="338">A를 다시 쓰기 전에만 그 세트의 fence를 기다린다</text>
  <text class="l" x="95" y="358">한 세트 = 커맨드 할당자 1 + Object CB + Pass CB + fence 값</text>
</svg>
